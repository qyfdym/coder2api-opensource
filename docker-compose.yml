services:
  coder2api:
    build: .
    container_name: coder2api
    restart: unless-stopped
    # 容器默认以 app 用户（uid 10001）运行。宿主机挂载目录属主不同会导致
    # 「写入 auths/*.json.tmp 失败 permission denied」，三种解法任选：
    #   1) 非 root · 让容器以你自己的 uid 运行（挂载目录本来就是你建的）：
    #      PUID=$(id -u) PGID=$(id -g) docker compose up -d
    #      或写进 .env 文件：PUID=1000 / PGID=1000
    #   2) sudo chown -R 10001:10001 ./auths ./data ./config.json
    #   3) user: "0:0" 以 root 运行（省事但容器逃逸面更大，自担）
    user: "${PUID:-10001}:${PGID:-10001}"
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "7863:7863"
    volumes:
      - ./auths:/app/auths
      - ./data:/app/data
      # 注意：宿主机必须先有 config.json（cp config.example.json config.json）。
      # 缺失时 Docker 会把挂载点创建成目录 → 容器启动失败（程序会自动生成配置，
      # 但前提是它能以文件形式写入 —— 挂载目录会挡住这条路径）。
      # 不挂 :ro：面板「配置」页需要写回此文件（保存后热生效）。
      - ./config.json:/app/config.json

  # Kiro 出口代理（可选）：Kiro 只对海外出口 IP 放出 Claude，国内服务器让 Kiro 的请求走海外节点。
  # 只有 config.json 里 kiro.proxy_url 指向它的 Kiro 请求会经过这里；WorkBuddy / Qoder 不受影响。
  # 启用：先按 deploy/mihomo/config.example.yaml 准备 ./mihomo/config.yaml（填机场订阅），再
  #   docker compose --profile proxy up -d
  # 不发布端口：只有同一 compose 网络里的 coder2api 能连 http://mihomo:7890。
  # 镜像拉不下来时，把 image 前缀换成你服务器能用的镜像加速地址。
  mihomo:
    image: metacubex/mihomo:latest
    container_name: coder2api-mihomo
    profiles: ["proxy"]
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./mihomo:/root/.config/mihomo
