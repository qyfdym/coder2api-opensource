# Kiro 出口代理（mihomo / Clash Meta）。
#
# 用途：Kiro 只对海外出口 IP 放出 Claude，国内服务器要让 Kiro 的请求走海外节点。
# 只有网关里的 Kiro 请求会经过它（config.json 里 kiro.proxy_url = http://mihomo:7890）；
# WorkBuddy / Qoder 不走这里，出口仍是服务器自己的 IP。
#
# 用法（在服务器项目目录）：
#   mkdir -p mihomo && cp deploy/mihomo/config.example.yaml mihomo/config.yaml
#   编辑 mihomo/config.yaml，把下面的订阅地址换成你的
#   docker compose --profile proxy up -d
#   docker compose logs -f mihomo        # 看到节点加载成功即可
#
# 这个文件里会有你的订阅地址，属于密钥：不要提交到版本库（/mihomo/ 已在 .gitignore 里）。

mixed-port: 7890      # http + socks5 混合端口
allow-lan: true       # 让同一个 compose 网络里的 coder2api 容器能连上；端口不对宿主机发布，外部访问不到
bind-address: "*"
mode: rule
log-level: info
ipv6: false

proxy-providers:
  airport:
    type: http
    url: "把机场订阅地址填在这里"
    path: ./proxy_providers/airport.yaml
    interval: 3600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      lazy: true

proxy-groups:
  # fallback：一直用过滤后排第一的可用节点，它不通了才换下一个，恢复后换回来。
  # 比自动测速切换稳定得多——同一个 Kiro 账号的出口 IP 不会频繁变。
  # 想彻底钉死一个节点：把 type 改成 select，再在 mihomo 里手动选（或把 filter 写成那个节点的名字）。
  - name: KIRO
    type: fallback
    use: [airport]
    filter: "(?i)美国|US|United States"
    url: https://www.gstatic.com/generate_204
    interval: 300
    lazy: true

rules:
  - MATCH,KIRO
